name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Contracts, tests and frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run coverage
      - run: npm run typecheck
      - run: npm run build
      - run: npm run demo

  slither:
    name: Slither static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: pip install slither-analyzer==0.11.6 solc-select
      - run: solc-select install 0.8.28 && solc-select use 0.8.28
      # Fails on any Medium or High finding; triaged findings are documented in
      # docs/ai-audit/report.md and docs/ai-audit/evidence/08-slither.txt.
      - run: npm run slither
