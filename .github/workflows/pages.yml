name: Pages

# Publishes the frontend to https://jacksonseowjx.github.io/Blockchain-DutchPoint/.
# One-time setup by a repository admin: Settings → Pages → Build and deployment → Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Only what a Pages deployment needs: read the code, publish to Pages, and request the OIDC
# token deploy-pages uses to prove the artifact came from this workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer push queues behind a running deployment instead of
# cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the frontend for GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      # The site is served from /<repo>/, not the domain root, so Vite needs that base path
      # (configure-pages reports it, e.g. "/Blockchain-DutchPoint"). The hosted build reads from
      # Sepolia; until a Sepolia deployment is committed to frontend/src/generated/deployments.json
      # the app shows a "not deployed yet" page. Everything here ends up in the public JavaScript
      # bundle, so never pass secrets: VITE_READ_RPC_URL must be a keyless (or domain-restricted) RPC.
      - name: Build
        run: npm run build -- --base "$BASE_PATH/"
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_DEFAULT_CHAIN_ID: "11155111"
          VITE_READ_RPC_URL: ${{ vars.VITE_READ_RPC_URL || 'https://ethereum-sepolia-rpc.publicnode.com' }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
